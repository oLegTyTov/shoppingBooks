<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Book</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 50px;
            max-width: 600px;
        }
        .btn-primary {
            width: 200px;
        }
        .alert {
            margin-top: 15px;
        }
    </style>
    <script>
        function validateForm() {
            const checkboxes = document.querySelectorAll('input[name="categories"]:checked');
            const photoInput = document.getElementById('photo');
            
            if (checkboxes.length === 0) {
                alert("Please select at least one category.");
                return false;
            }
            
            if (!photoInput.files.length) {
                alert("Please upload a photo.");
                return false;
            }
            
            return true;
        }
    </script>
</head>
<body>
    <div class="container">
        <h2 class="mb-4">Add a New Book</h2>

        <form th:action="@{/admin/addBook}" method="post" enctype="multipart/form-data" onsubmit="return validateForm()">
            <div class="form-group">
                <label for="title">Title:</label>
                <input type="text" class="form-control" id="title" name="title" required>
            </div>
            
            <div class="form-group">
                <label for="price">Price:</label>
                <input type="number" step="0.01" class="form-control" id="price" name="price" required>
            </div>
            
            <div class="form-group">
                <label for="publicationDate">Publication Date:</label>
                <input type="date" class="form-control" id="publicationDate" name="publicationDate" required>
            </div>
            
            <div class="form-group">
                <label for="creationDate">Creation Date:</label>
                <input type="date" class="form-control" id="creationDate" name="creationDate" required>
            </div>

            <div class="form-group">
                <label for="firstName">Author's First Name:</label>
                <input type="text" class="form-control" id="firstName" name="author.firstName" required>
            </div>

            <div class="form-group">
                <label for="lastName">Author's Last Name:</label>
                <input type="text" class="form-control" id="lastName" name="author.lastName" required>
            </div>

            <div class="form-group">
                <label for="description">Description:</label>
                <textarea class="form-control" id="description" name="description" rows="4" required></textarea>
            </div>

            <!-- Динамічне завантаження категорій -->
            <div class="form-group">
                <label>Categories:</label><br>
                <div th:each="category : ${categoriesFilms}">
                    <input type="checkbox" th:id="${category.id}" name="categories" th:value="${category.name}">
                    <label th:for="${category.id}" th:text="${category.name}"></label><br>
                </div>
            </div>

            <div class="form-group">
                <label for="photo">Photo:</label>
                <input type="file" class="form-control-file" id="photo" name="photo" accept="image/*">
            </div>

            <button type="submit" class="btn btn-primary">Add Book</button>
        </form>

        <div th:if="${error}" class="alert alert-danger">
            <p>Error: Book could not be added. Please try again.</p>
        </div>

        <a class="btn btn-secondary mt-3" th:href="@{/admin}">Back to Admin Page</a>
    </div>
</body>
</html>
