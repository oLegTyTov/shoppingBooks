<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Category</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .container { margin-top: 50px; max-width: 500px; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="mb-4">Delete Category</h2>
        <form th:action="@{/admin/deleteCategory}" method="post">
            <div class="form-group">
                <label for="nameCategory">Category Name:</label>
                <input type="text" class="form-control" id="nameCategory" name="nameCategory" required>
            </div>
            <button type="submit" class="btn btn-danger">Delete Category</button>
        </form>
        <div th:if="${error}" class="alert alert-danger mt-3">Category does not exist!</div>
        <a th:href="@{/admin}" class="btn btn-secondary mt-3">Back to Admin Page</a>
    </div>
</body>
</html>
