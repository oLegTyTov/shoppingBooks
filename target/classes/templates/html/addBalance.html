<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Balance</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .container { margin-top: 50px; max-width: 400px; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="mb-4">Add Balance</h2>
        <form th:action="@{/addBalance}" method="post">
            <div class="form-group">
                <label for="balance">Amount to Add:</label>
                <input type="number" class="form-control" id="balance" name="balance" step="0.01" min="0" required>
            </div>
            <button type="submit" class="btn btn-success">Add Balance</button>
        </form>
        <a th:href="@{/myAccount}" class="btn btn-secondary mt-3">Back to My Account</a>
    </div>
</body>
</html>
