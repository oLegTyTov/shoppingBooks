<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Page</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            background-color: #6f42c1;
        }
        .navbar-brand, .navbar-nav .nav-link {
            color: #ffffff !important;
        }
        .navbar-nav .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 0.25rem;
        }
        .container {
            margin-top: 30px;
        }
        .btn-primary, .btn-success, .btn-danger {
            width: 200px;
            text-align: center;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <a class="navbar-brand" href="/">Shopping Books</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="/getCategories">Categories</a></li>
                <li class="nav-item"><a class="nav-link" href="/getAuthors">Authors</a></li>
                <li class="nav-item"><a class="nav-link" href="/about">About Us</a></li>
                <li class="nav-item"><a class="nav-link" href="/contact">Contact Us</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin">Admin Dashboard</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <h1>Welcome, <span th:text="${username}">Admin</span>!</h1>
        <ul class="list-group mt-3">
            <li class="list-group-item"><a class="btn btn-primary" th:href="@{/admin/addAuthor}">Add Author</a></li>
            <li class="list-group-item"><a class="btn btn-primary" th:href="@{/admin/addBook}">Add Book</a></li>
            <li class="list-group-item"><a class="btn btn-primary" th:href="@{/admin/deleteBook}">Delete Book</a></li>
            <li class="list-group-item"><a class="btn btn-primary" th:href="@{/admin/deleteAuthor}">Delete Author</a></li>
            <li class="list-group-item"><a class="btn btn-success" th:href="@{/admin/addCategory}">Add Category</a></li>
            <li class="list-group-item"><a class="btn btn-danger" th:href="@{/admin/deleteCategory}">Delete Category</a></li>
        </ul>
    </div>
</body>
</html>
